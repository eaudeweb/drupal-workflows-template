name: Cleanup Git Tags

on:
  # cronjob trigger
  schedule:
  - cron: "0 6 * * 1"  # Every Monday 6:00 AM UTC
  # manual trigger
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: eaudeweb/git-repo-clean@1.x
        with:
          keep: 50
          months: 6
          apply: true
          

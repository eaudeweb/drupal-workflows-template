# DO NOT EDIT - This file is managed by the template repository.
# Source: https://github.com/eaudeweb/drupal-workflows-template
# Project-specific settings are configured through repository variables (SEC_UPDATE_*), see README.md.
#
# Runs `composer audit` against composer.lock (advisories come from Packagist and
# packages.drupal.org, so Drupal core and contrib SAs are covered), updates only the
# vulnerable packages and opens (or refreshes) a pull request with the changes.
name: 'Security updates (composer)'

on:
  schedule:
    - cron: "30 5 * * *"      # Daily, 05:30 UTC
    - cron: "30 17-22 * * 3"  # Hourly on Wednesday evening (Drupal security release window)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  composer-security-update:
    name: 'Update vulnerable composer packages'
    runs-on: ${{ vars.SEC_UPDATE_RUNNER || 'drupal-runner-v2' }}
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      COMPOSER_NO_INTERACTION: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PROD_PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Audit composer.lock
        id: audit
        run: |
          # Work files live outside the checkout so they are never committed.
          WORK="$RUNNER_TEMP/sec-update"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK"
          cp composer.lock "$WORK/composer.lock.before"
          composer audit --locked --abandoned=ignore --format=json > "$WORK/audit-before.json" || true
          jq -e '.advisories' "$WORK/audit-before.json" > /dev/null \
            || { echo "::error::composer audit did not return valid JSON"; cat "$WORK/audit-before.json"; exit 1; }
          jq -r '.advisories | keys[]' "$WORK/audit-before.json" | sort -u > "$WORK/vulnerable.txt"
          echo "count=$(wc -l < "$WORK/vulnerable.txt")" >> "$GITHUB_OUTPUT"
          if [ -s "$WORK/vulnerable.txt" ]; then
            echo "Vulnerable packages:"; cat "$WORK/vulnerable.txt"
          else
            echo "No known vulnerabilities in composer.lock."
          fi

      - name: Update vulnerable packages
        if: steps.audit.outputs.count != '0'
        run: |
          # Resolve for the production PHP version, but do not require every PHP
          # extension used in production to be present on the runner.
          # --minimal-changes: touch transitive dependencies only when required.
          OPTS=(--minimal-changes --no-progress --ignore-platform-req='ext-*' --ignore-platform-req='lib-*')

          # Each update is attempted separately: when no secure version fits the
          # constraints, composer refuses to resolve (insecure versions are blocked).
          # That must not prevent the other packages from being updated; leftovers
          # are reported by the re-audit step.
          try_update() {
            if ! composer update "$@" "${OPTS[@]}"; then
              echo "::warning::composer update $1 failed, a manual update is required"
              echo "$1" >> "$WORK/failed.txt"
            fi
          }
          touch "$WORK/failed.txt"

          # drupal/core-recommended pins core dependencies, so all drupal/core*
          # packages must be updated together.
          if grep -q '^drupal/core' "$WORK/vulnerable.txt"; then
            try_update 'drupal/core*' --with-all-dependencies
          fi

          grep -v '^drupal/core' "$WORK/vulnerable.txt" | while read -r PKG; do
            try_update "$PKG" --with-dependencies
          done

      - name: Re-audit and build report
        id: report
        if: steps.audit.outputs.count != '0'
        run: |
          composer audit --locked --abandoned=ignore --format=json > "$WORK/audit-after.json" || true
          REMAINING=$(jq -r '.advisories | keys | length' "$WORK/audit-after.json")
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"

          # name => version maps of the lock file, before and after the update.
          VERSIONS='[.packages[], (.["packages-dev"] // [])[]] | map({(.name): .version}) | add // {}'
          jq "$VERSIONS" "$WORK/composer.lock.before" > "$WORK/v-before.json"
          jq "$VERSIONS" composer.lock > "$WORK/v-after.json"

          {
            echo "Automated security update generated by \`composer audit\`."
            echo
            echo "### Advisories found"
            echo
            echo "| Package | Advisory | Severity | CVE |"
            echo "|---|---|---|---|"
            jq -r '.advisories | to_entries[] | .value[] |
              "| `\(.packageName)` | [\(.title | gsub("\\|"; "/"))](\(.link // "")) | \(.severity // "-") | \(.cve // "-") |"' \
              "$WORK/audit-before.json"
            echo
            echo "### Version changes"
            echo
            echo "| Package | From | To |"
            echo "|---|---|---|"
            jq -rn --slurpfile b "$WORK/v-before.json" --slurpfile a "$WORK/v-after.json" '
              ($b[0]) as $b | ($a[0]) as $a
              | (($b | keys) + ($a | keys) | unique)[]
              | select($b[.] != $a[.])
              | "| `\(.)` | \($b[.] // "-") | \($a[.] // "-") |"'
            if [ "$REMAINING" != "0" ]; then
              echo
              echo "### :warning: Still vulnerable after update"
              echo
              echo "These packages could not be updated within the constraints from \`composer.json\`"
              echo "(e.g. the fix only exists in a newer minor/major version, or no fix is released yet)."
              echo "They need a manual change:"
              echo
              jq -r '.advisories | keys[] | "- `\(.)`"' "$WORK/audit-after.json"
              if [ -s "$WORK/failed.txt" ]; then
                echo
                echo "Failed \`composer update\` calls (see the action run log for details):"
                while read -r F; do echo "- \`$F\`"; done < "$WORK/failed.txt"
              fi
            fi
            echo
            echo "---"
            echo "Before merging: run \`drush updb\` on the test instance, check that custom patches still apply and smoke-test the site."
          } > "$WORK/pr-body.md"

          cat "$WORK/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create pull request
        id: cpr
        if: steps.audit.outputs.count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with GITHUB_TOKEN do not trigger other workflows (e.g. QA).
          # Set SECURITY_UPDATE_TOKEN (PAT or GitHub App token) to have checks run on the PR.
          token: ${{ secrets.SECURITY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: security/composer-update
          delete-branch: true
          commit-message: "[Security] Update vulnerable composer packages"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "[Security] Composer security updates"
          body-path: ${{ env.WORK }}/pr-body.md
          labels: |
            security
            automated
          reviewers: ${{ vars.SEC_UPDATE_REVIEWERS }}

      - name: 'Discord notification'
        if: steps.audit.outputs.count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OP: ${{ steps.cpr.outputs.pull-request-operation }}
          REMAINING: ${{ steps.report.outputs.remaining }}
          COUNT: ${{ steps.audit.outputs.count }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0

          # Notify when the PR was created/updated. Unresolved advisories with no
          # PR change are reported once a day (or on manual run), not every hour.
          NOTIFY=false
          if [ "$PR_OP" = "created" ] || [ "$PR_OP" = "updated" ]; then
            NOTIFY=true
          elif [ "$REMAINING" != "0" ] && { [ "$SCHEDULE" = "30 5 * * *" ] || [ -z "$SCHEDULE" ]; }; then
            NOTIFY=true
          fi
          [ "$NOTIFY" = "true" ] || exit 0

          MSG=":shield: **${{ github.repository }}** has $COUNT vulnerable composer package(s)."
          if [ -n "$PR_URL" ]; then MSG="$MSG Pull request: <$PR_URL>."; fi
          if [ "$REMAINING" != "0" ]; then MSG="$MSG :warning: $REMAINING package(s) need a manual update."; fi
          MSG="$MSG [view action run]($RUN_URL)"
          curl -sS -X POST --form-string "content=$MSG" "$DISCORD_WEBHOOK"

      - name: 'Discord notification on failure'
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          curl -sS -X POST --form-string \
            "content=:octagonal_sign: **${{ github.repository }}** composer security update failed (dependency conflict or patch failure?). [view action run]($RUN_URL)" \
            "$DISCORD_WEBHOOK"

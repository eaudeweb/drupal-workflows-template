# DO NOT EDIT - This file is managed by the template repository.
# Source: https://github.com/eaudeweb/drupal-workflows-template
on:
  workflow_dispatch:
    inputs:
      dump_prod_db:
        description: 'Dump PROD SQL database before sync'
        type: boolean
        required: true
        default: false

name: 'Sync PRODUCTION to DEV'
jobs:
  dump_prod:
    name: 'Dump PROD SQL database'
    if: ${{ inputs.dump_prod_db }}
    runs-on: ${{ vars.PROD_RUNNER || 'drupal-runner-v2' }}
    steps:
      - name: 'Dump SQL database'
        uses: eaudeweb/drupal-sql-dump-action@2.x
        with:
          ssh_user:               ${{ secrets.PROD_SSH_USER }}
          ssh_host:               ${{ secrets.PROD_SSH_HOST }}
          ssh_key:                ${{ secrets.PROD_SSH_KEY }}
          project_dir:            ${{ vars.PROD_PROJECT_DIR }}
          sql_dump_file:          ${{ vars.PROD_DATABASE_DUMP_DIR }}/database.sql
          nextcloud_path:         ${{ vars.PROD_NEXTCLOUD_PATH }}
          nextcloud_user:         ${{ secrets.NEXTCLOUD_USER }}
          nextcloud_app_password: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
  db:
    name: 'Executing synchronization'
    needs: dump_prod
    if: ${{ always() }}
    runs-on: ${{ vars.DEV_RUNNER || 'drupal-runner-v2' }}
    steps:
      - name: 'Running'
        uses: eaudeweb/drupal-sync-action@2.x
        with:
          target_ssh_user:             ${{ secrets.DEV_SSH_USER }}
          target_ssh_host:             ${{ secrets.DEV_SSH_HOST }}
          target_ssh_key:              ${{ secrets.DEV_SSH_KEY }}
          target_project_dir:          ${{ vars.DEV_PROJECT_DIR }}
          nextcloud_path:              ${{ vars.PROD_NEXTCLOUD_PATH }}
          nextcloud_user:              ${{ secrets.NEXTCLOUD_USER }}
          nextcloud_app_password:      ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
